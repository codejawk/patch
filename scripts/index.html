<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch Merger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --panel2:#f6f8fb; --ink:#152030; --muted:#5a6675;
    --faint:#8b97a6; --line:#dbe1ea; --accent:#2f4bb0; --accent-ink:#fff;
    --good:#1a7f4b; --good-bg:#e4f4ea; --warn:#a6690b; --warn-bg:#fbf1de;
    --danger:#b8321f; --danger-bg:#fbe9e6; --accent-bg:#e6ebf8;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#161c26; --panel2:#1c232f; --ink:#e7ecf3; --muted:#9aa7b7;
    --faint:#66727f; --line:#28313d; --accent:#8098ff;
    --good:#68c795; --good-bg:#132a1e; --warn:#e0ac52; --warn-bg:#2c2413;
    --danger:#f0917f; --danger-bg:#2e1815; --accent-bg:#1e2740;
  }}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .spacer{flex:1}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    white-space:nowrap;cursor:pointer}
  .toggle.off{opacity:.45}
  .inputbar{padding:9px 20px;border-bottom:1px solid var(--line);background:var(--panel2);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .inputbar label{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .inputbar input{font-family:var(--mono);font-size:11.5px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:6px 9px;flex:1;min-width:220px}
  button.act{font-family:var(--sans);font-weight:600;cursor:pointer;border-radius:7px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;font-size:12.5px}
  button.act.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.act:disabled{opacity:.5;cursor:default}
  .main{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
  .main.folder{grid-template-columns:330px 1fr}
  .list{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel);display:none}
  .main.folder .list{display:block}
  .list .bar{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
    padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:1;font-size:11px;color:var(--faint)}
  .row{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:var(--panel2)} .row.sel{background:var(--accent-bg)}
  .row .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row .name{font-family:var(--mono);font-size:11.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .row .meta{font-size:11px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
  .row .acts{margin-top:8px;display:flex;gap:6px}
  .row .acts button{padding:4px 9px;font-size:11px}
  .badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    font-weight:600;padding:3px 7px;border-radius:999px;white-space:nowrap}
  .b-applied{color:var(--good);background:var(--good-bg)}
  .b-no-op{color:var(--accent);background:var(--accent-bg)}
  .b-needs-review{color:var(--warn);background:var(--warn-bg)}
  .b-rejected{color:var(--danger);background:var(--danger-bg)}
  .b-none{color:var(--faint);border:1px solid var(--line)}
  .view{position:relative;background:var(--bg);min-height:0}
  iframe{width:100%;height:100%;border:0;background:var(--bg)}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--faint);text-align:center;padding:30px}
  .empty .big{font-size:15px;color:var(--muted)}
  .spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:2}
  .spin.on{display:flex}
  .spin .dot{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .spin .msg{font-size:13px;color:var(--muted)}
  .warnbar{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:6px 20px;border-bottom:1px solid var(--line)}
  /* live Claude terminal panel */
  .stream{position:absolute;inset:0;background:#0b0e14;display:none;flex-direction:column;z-index:3}
  .stream.on{display:flex}
  .term-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#11151d;border-bottom:1px solid #1e2530}
  .term-dots{display:flex;gap:6px}
  .term-dots i{width:11px;height:11px;border-radius:50%;display:block}
  .term-dots i:nth-child(1){background:#ff5f56} .term-dots i:nth-child(2){background:#ffbd2e} .term-dots i:nth-child(3){background:#27c93f}
  .term-ttl{font-family:var(--mono);font-size:12px;color:#8b98a9;margin-left:6px}
  .term-live{margin-left:auto;font-family:var(--mono);font-size:11px;color:#27c93f;display:flex;align-items:center;gap:6px}
  .term-live.done{color:#8b98a9}
  .term-live .p{width:8px;height:8px;border-radius:50%;background:#27c93f;animation:pulse 1s infinite}
  .term-live.done .p{background:#8b98a9;animation:none}
  @keyframes pulse{50%{opacity:.25}}
  .term-x{cursor:pointer;color:#8b98a9;font-family:var(--mono);font-size:14px;padding:0 4px}
  .term-x:hover{color:#fff}
  .term-body{flex:1;overflow-y:auto;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#b9c2cf}
  .term-cmd{color:#7fd88f;margin:12px 0 5px;white-space:pre-wrap}
  .term-cmd:first-child{margin-top:0}
  .term-cmd .pr{color:#5b8cff;font-weight:600}
  .term-cmd .cm{color:#6b7686}
  .term-in{white-space:pre-wrap;word-break:break-word;color:#5b6673;margin:2px 0 8px;
    padding:6px 10px;border-left:2px solid #232a35;font-size:12px;max-height:150px;overflow:auto}
  .term-out{white-space:pre-wrap;word-break:break-word;color:#aeb8c6;margin:0}
  .term-out.active::after{content:'▋';color:#e6edf3;margin-left:1px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .term-res{margin:4px 0 2px}
  .term-res.ok{color:#27c93f} .term-res.warn{color:#e0b64a} .term-res.info{color:#5b8cff}
</style>
</head>
<body>
<header>
  <h1>Patch Merger</h1>
  <div class="seg">
    <button id="mFile" class="on" data-mode="file">Single file</button>
    <button id="mFolder" data-mode="folder">Folder</button>
  </div>
  <div class="spacer"></div>
  <label class="toggle off" id="assistToggle" title="Use the Claude CLI to analyse conflicts and propose a verified rebase">
    <input type="checkbox" id="assist"> AI-assist
  </label>
  <label class="toggle" title="Preview writes nothing; Apply / write mode writes clean results">
    <input type="checkbox" id="applyMode"> write (apply)
  </label>
  <label class="toggle off" id="p4Toggle" title="Perforce: the target may be a //depot/... path; runs `p4 edit` before writing">
    <input type="checkbox" id="p4"> p4
  </label>
  <button class="act" id="termBtn" hidden title="Show the Claude terminal for the last run">⌵ what's running</button>
</header>

<!-- single-file input bar -->
<div class="inputbar" id="barFile">
  <label>target file</label><input id="file" spellcheck="false" placeholder="/path/to/source/file.c">
  <label>patch</label><input id="patch1" spellcheck="false" placeholder="/path/to/fix.patch">
  <button class="act pri" id="mergeBtn">Merge →</button>
</div>

<!-- folder input bar -->
<div class="inputbar" id="barFolder" hidden>
  <label>tree</label><input id="tree" spellcheck="false">
  <label>patches</label><input id="patches" spellcheck="false">
  <button class="act pri" id="loadBtn">Load</button>
  <button class="act" id="runall">Run all →</button>
</div>

<div class="warnbar" id="warn" hidden></div>

<div class="main" id="main">
  <div class="list"><div class="bar"><span id="count"></span></div><div id="rows"></div></div>
  <div class="view">
    <iframe id="frame" hidden></iframe>
    <div class="empty" id="empty">
      <div class="big" id="emptyBig">Enter a target file and a patch, then Merge</div>
      <div>Preview writes nothing. Turn on <b>AI-assist</b> for conflicts,<br>or <b>write (apply)</b> to land a clean patch.</div>
    </div>
    <div class="spin" id="spin"><div class="dot"></div><div class="msg" id="spinmsg">Merging…</div></div>
    <div class="stream" id="stream">
      <div class="term-bar">
        <span class="term-dots"><i></i><i></i><i></i></span>
        <span class="term-ttl">claude — patch-merger</span>
        <span class="term-live" id="termLive"><span class="p"></span> <span id="termStatus">running</span></span>
        <span class="term-x" id="termClose" title="close (report stays)">✕</span>
      </div>
      <div class="term-body" id="sBody"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let PATCHES = [], selected = null, claudeOK = false, MODE = 'file';

async function jget(u){ return (await fetch(u)).json(); }
async function jpost(u,b){ return (await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json(); }

(async function init(){
  const c = await jget('/api/config');
  $('#file').value = c.file || ''; $('#patch1').value = c.patch || '';
  $('#tree').value = c.tree || ''; $('#patches').value = c.patches || '';
  claudeOK = c.claude;
  if(!claudeOK){ $('#assist').disabled = true;
    $('#assistToggle').title = 'claude CLI not found on PATH — AI-assist unavailable'; }
  if(!c.p4){ $('#p4').disabled = true;
    $('#p4Toggle').title = 'p4 not found on PATH — enable it where Perforce is installed (your office)'; }
  syncToggle();
})();

$('#assist').onchange = syncToggle;
$('#p4').onchange = syncToggle;
function syncToggle(){
  $('#assistToggle').classList.toggle('off', !$('#assist').checked);
  $('#p4Toggle').classList.toggle('off', !$('#p4').checked);
}

// mode switch
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  MODE = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
  $('#barFile').hidden = MODE!=='file';
  $('#barFolder').hidden = MODE!=='folder';
  $('#main').classList.toggle('folder', MODE==='folder');
  $('#emptyBig').textContent = MODE==='file'
    ? 'Enter a target file and a patch, then Merge'
    : 'Load a patches folder, then pick a patch';
});

function busy(on,msg){ $('#spin').classList.toggle('on',on); if(msg)$('#spinmsg').textContent=msg; }
function showReport(html){ $('#empty').style.display='none'; const f=$('#frame'); f.hidden=false; f.srcdoc=html; }
function spinMsg(){ return $('#assist').checked
  ? 'Merging… (asking Claude to analyse & rebase — this can take a moment)' : 'Merging…'; }

// ---- single file ----
$('#mergeBtn').onclick = ()=>runFile($('#applyMode').checked);
async function runFile(apply){
  const file = $('#file').value.trim(), patch = $('#patch1').value.trim();
  if(!file || !patch){ alert('Enter both a target file and a patch path.'); return; }
  if($('#assist').checked) return streamMerge({patch_path:patch, file_path:file, apply});
  busy(true, spinMsg());
  try{
    const res = await jpost('/api/run', {patch_path:patch, file_path:file, apply, assist:false, p4:$('#p4').checked});
    if(res.error){ alert('Error: '+res.error); return; }
    showReport(res.report_html);
    if(res.p4) alert('p4:\n'+res.p4.join('\n'));
  }finally{ busy(false); }
}

// ---- streaming (AI-assist): watch Claude work live in a terminal panel ----
function streamPanel(on){ $('#stream').classList.toggle('on', on); }
let curOut=null;
function termCmd(cmd, comment){
  const d=document.createElement('div'); d.className='term-cmd';
  d.innerHTML=`<span class="pr">$</span> ${cmd}` + (comment?`   <span class="cm"># ${comment}</span>`:'');
  $('#sBody').appendChild(d);
}
function termOut(){
  if(curOut) curOut.classList.remove('active');
  const p=document.createElement('div'); p.className='term-out active';
  $('#sBody').appendChild(p); curOut=p; scrollTerm(); return p;
}
function termRes(text, cls){
  if(curOut) curOut.classList.remove('active');
  const d=document.createElement('div'); d.className='term-res '+(cls||'ok'); d.textContent=text;
  $('#sBody').appendChild(d); scrollTerm();
}
function termInput(text){
  const d=document.createElement('div'); d.className='term-in';
  const cap=1800; const shown = text.length>cap ? text.slice(0,cap)+'\n… (+'+(text.length-cap)+' more chars of prompt sent to Claude)' : text;
  d.textContent='┌─ stdin (prompt) ─\n'+shown; $('#sBody').appendChild(d); scrollTerm();
}
function termAppend(t){ if(curOut){ curOut.textContent+=t; scrollTerm(); } }
function scrollTerm(){ const b=$('#sBody'); b.scrollTop=b.scrollHeight; }
function termSetStatus(s, done){ $('#termStatus').textContent=s; $('#termLive').classList.toggle('done', !!done); }

$('#termBtn').onclick=()=>streamPanel(true);
$('#termClose').onclick=()=>streamPanel(false);

function streamMerge(params){
  $('#empty').style.display='none'; $('#frame').hidden=true;
  $('#sBody').innerHTML=''; curOut=null; $('#termBtn').hidden=false;
  termSetStatus('running', false); streamPanel(true);
  const qs=new URLSearchParams({patch_path:params.patch_path, file_path:params.file_path,
    apply:params.apply?'1':'0', assist:'1', p4:$('#p4').checked?'1':'0'}).toString();
  const es=new EventSource('/api/run_stream?'+qs);
  es.onmessage=(e)=>{
    const o=JSON.parse(e.data);
    if(o.phase==='merged'){
      termCmd('patch-merger --file '+shortPath(params.file_path), 'deterministic merge');
      const ai=(o.status==='needs-review'||o.status==='rejected');
      termRes('→ '+o.status.toUpperCase()+(ai?'  — handing to Claude for analysis + rebase':'  — clean, no AI needed'), ai?'warn':'ok');
    }
    else if(o.phase==='analyse'){
      if(o.start){ termSetStatus('analysing…'); termCmd('claude -p --output-format stream-json --include-partial-messages','analyse the conflict'); if(o.prompt) termInput(o.prompt); termOut(); }
      else if(o.delta){ termAppend(o.delta); }
      else if(o.done){ termRes('✓ analysis complete — '+o.count+' blockers found','ok'); }
    }
    else if(o.phase==='rebase'){
      if(o.start){ termSetStatus('rebasing…'); termCmd('claude -p --output-format stream-json --include-partial-messages','propose a rebase against the current code'); if(o.prompt) termInput(o.prompt); termOut(); }
      else if(o.delta){ termAppend(o.delta); }
      else if(o.done){ termRes(o.verified?'✓ rebase re-verified with git apply — applies cleanly':'✗ rebase did not verify — draft only', o.verified?'ok':'warn'); }
    }
    else if(o.phase==='p4'){
      termCmd('p4 edit '+shortPath(params.file_path), 'open for edit in Perforce');
      termRes((o.ok?'✓ ':'✗ ')+o.msg, o.ok?'ok':'warn');
    }
    else if(o.phase==='done'){
      es.close(); termRes('✓ done — rendering the report','info'); termSetStatus('done', true);
      setTimeout(()=>{ streamPanel(false); showReport(o.report_html); }, 900);
    }
    else if(o.phase==='error'){ es.close(); termRes('✗ error: '+o.error,'warn'); termSetStatus('error', true); }
  };
  es.onerror=()=>{ es.close(); if(!$('#frame').srcdoc){ termSetStatus('connection closed', true); } };
}
function shortPath(p){ return (p||'').split('/').slice(-2).join('/'); }

// ---- folder ----
$('#loadBtn').onclick = load;
async function load(){
  const r = await jpost('/api/patches', {patches:$('#patches').value, tree:$('#tree').value});
  PATCHES = r.patches || []; selected=null;
  $('#warn').hidden = r.tree_ok;
  if(!r.tree_ok) $('#warn').textContent = 'Tree path not found — check the "tree" field.';
  $('#count').textContent = PATCHES.length + ' patches';
  renderRows();
}
function renderRows(){
  const box=$('#rows'); box.innerHTML='';
  PATCHES.forEach(p=>{
    const d=document.createElement('div');
    d.className='row'+(selected===p.filename?' sel':'');
    d.innerHTML=`<div class="top"><span class="name" title="${p.filename}">${p.filename}</span>
      <span class="badge b-${p.status||'none'}" data-badge="${p.id}">${p.status||'—'}</span></div>
      <div class="meta">${p.cve||'no CVE'} · ${p.severity||''} · ${p.dialect}</div>
      <div class="acts"><button data-preview="${p.filename}">Preview</button>
      <button data-apply="${p.filename}">Apply</button></div>`;
    box.appendChild(d);
  });
}
async function runFolder(filename, apply){
  const p=PATCHES.find(x=>x.filename===filename); selected=filename; renderRows();
  busy(true, spinMsg());
  try{
    const res=await jpost('/api/run',{patch_path:$('#patches').value.replace(/\/+$/,'')+'/'+filename,
      tree:$('#tree').value, apply, assist:$('#assist').checked});
    if(res.error){ alert('Error: '+res.error); return; }
    p.status=res.status; const b=document.querySelector(`[data-badge="${p.id}"]`);
    if(b){ b.className='badge b-'+res.status; b.textContent=res.status; }
    showReport(res.report_html);
  }finally{ busy(false); }
}
$('#rows').addEventListener('click', e=>{
  const pv=e.target.closest('[data-preview]'), ap=e.target.closest('[data-apply]'), row=e.target.closest('.row');
  if(pv) return runFolder(pv.dataset.preview,false);
  if(ap) return runFolder(ap.dataset.apply,true);
  if(row) return runFolder(row.querySelector('.name').title,false);
});
$('#runall').onclick = async ()=>{
  busy(true, $('#assist').checked?'Running all… (Claude assists on conflicts)':'Running all…');
  try{
    const res=await jpost('/api/batch',{patches:$('#patches').value,tree:$('#tree').value,
      apply:$('#applyMode').checked, assist:$('#assist').checked});
    if(res.error){ alert('Error: '+res.error); return; }
    (res.rows||[]).forEach(r=>{const p=PATCHES.find(x=>x.id===r.id); if(p)p.status=r.status;});
    renderRows(); showReport(res.summary_html); selected=null;
  }finally{ busy(false); }
};
</script>
</body>
</html>
